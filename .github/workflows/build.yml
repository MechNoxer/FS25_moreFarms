# Builds the mod zip on every push to main and publishes it as a GitHub Release.
# The release tag comes from <version> in modDesc.xml (e.g. v1.0.0.0):
#   - new version  -> a new release is created
#   - same version -> the zip on the existing release is replaced
# Reusable: copy this file and build.sh into any FS25 mod repo, no edits needed.
name: Build mod zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        id: build
        run: |
          chmod +x build.sh
          ./build.sh
          MOD_DIR="$(dirname "$(ls -d */modDesc.xml | head -n 1)")"
          VERSION="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "$MOD_DIR/modDesc.xml" | head -n 1)"
          echo "zip=$MOD_DIR.zip" >> "$GITHUB_OUTPUT"
          echo "name=$MOD_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.zip }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
          NAME: ${{ steps.build.outputs.name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$NAME $TAG" --generate-notes --target "$GITHUB_SHA"
          fi
